<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arafi Technology - Adsgram</title>

<style>
body{
font-family:Arial;
background:#f0f2f5;
margin:0;
padding:20px;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}
.container{
background:#fff;
padding:25px;
border-radius:10px;
box-shadow:0 4px 8px rgba(0,0,0,.1);
text-align:center;
max-width:400px;
width:100%;
}
.stats{
display:flex;
justify-content:center;
margin-bottom:20px;
background:#e9ecef;
padding:15px;
border-radius:8px;
}
.stat-value{
font-size:1.5em;
font-weight:bold;
color:#28a745;
}
.button-group{
display:flex;
flex-direction:column;
gap:10px;
}
button{
background:#007bff;
color:#fff;
border:none;
padding:15px;
border-radius:5px;
cursor:pointer;
}
button:disabled{
opacity:.6;
cursor:not-allowed;
}
.withdraw-btn{
background:#28a745;
}
.modal{
display:none;
position:fixed;
z-index:1;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
}
.modal-content{
background:#fff;
margin:15% auto;
padding:20px;
width:80%;
max-width:500px;
border-radius:10px;
}
.close{
float:right;
font-size:28px;
cursor:pointer;
}
input{
width:calc(100% - 22px);
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}
</style>

<!-- Adsgram SDK যুক্ত করা হলো -->
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

</head>
<body>

<div class="container">

<h2>Telegram Mini Self Earning App</h2>

<div class="stats">
<div>
<div id="earned-points" class="stat-value">0</div>
<div>Total Points</div>
</div>
</div>

<div class="button-group">
<button id="rewardBtn">Watch Reward Ad</button>
<button class="withdraw-btn" onclick="openWithdrawModal()">Withdraw</button>
</div>

</div>

<div id="withdrawModal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeWithdrawModal()">&times;</span>
<h2>Withdraw Points</h2>
<form id="withdrawForm">

<input type="text" id="referName" placeholder="Enter Refer Name" required>

<input type="number" id="pointsToWithdraw" placeholder="Enter Points to Withdraw" required>

<button type="submit">Send Withdraw Request</button>

</form>
</div>
</div>

<script>

let adsWatched = localStorage.getItem('adsWatched') ? parseInt(localStorage.getItem('adsWatched')) : 0;
let earnedPoints = localStorage.getItem('earnedPoints') ? parseInt(localStorage.getItem('earnedPoints')) : 0;
let isProcessing = false;

function updateStats(){
document.getElementById("earned-points").innerText = earnedPoints;
localStorage.setItem("earnedPoints", earnedPoints);
localStorage.setItem("adsWatched", adsWatched);
}

// পেজ লোড হওয়ার পর স্ট্যাট আপডেট করা
window.addEventListener('DOMContentLoaded', () => {
    updateStats();
});

// BUTTON CLICK - অ্যাড দেখানোর লজিক
document.getElementById("rewardBtn").onclick = async function(){
const btn = this;
btn.disabled = true;
btn.innerText = "Loading Ad...";

try {
    // আপনার Adsgram ব্লক আইডি এখানে বসিয়ে দিন (যেমন: "int-xxxx")
    const blockId = "YOUR_BLOCK_ID"; 

    // Adsgram অ্যাড ইনিশিয়েট ও শো করা
    await window.Adsgram.init({ blockId: blockId }).show();
    
    // অ্যাড সফলভাবে দেখা শেষ হলে পয়েন্ট যোগ হবে
    adsWatched++;
    earnedPoints++;
    updateStats();
    
    btn.disabled = false;
    btn.innerText = "Watch Reward Ad";

} catch (error) {
    // ব্যবহারকারী অ্যাড কেটে দিলে বা কোনো এরর হলে এখানে আসবে
    console.log("Ad error or skipped:", error);
    btn.disabled = false;
    btn.innerText = "Watch Reward Ad";
    alert("Ad was closed or failed to load.");
}

};

// WITHDRAW
const modal = document.getElementById('withdrawModal');

function openWithdrawModal(){ modal.style.display='block'; }
function closeWithdrawModal(){ modal.style.display='none'; }

window.onclick = e => { if(e.target==modal) closeWithdrawModal(); };

document.getElementById('withdrawForm').addEventListener('submit', function(e){

e.preventDefault();

if(isProcessing){ alert("Please wait..."); return; }

const referName = document.getElementById('referName').value;
const points = parseInt(document.getElementById('pointsToWithdraw').value);

if(points > earnedPoints || points <= 0){
alert("Invalid amount!");
return;
}

isProcessing = true;

earnedPoints -= points;
updateStats();
closeWithdrawModal();

alert("✅ Withdraw sent successfully!");

const now = new Date();
const date = now.toLocaleDateString("en-US",{timeZone:"Asia/Dhaka"});
const time = now.toLocaleTimeString("en-US",{timeZone:"Asia/Dhaka"});

sendTelegram(referName, points, date, time);

isProcessing = false;

});

// TELEGRAM 
function sendTelegram(referName, points, date, time){

const botToken = "9047540592:AAGI1hPX3joZ4UWhHchTPhLgNM60RzXg9BU";
const adminChatId = "6529025445";

const message = `🚀 New Withdraw Request
Refer Name: ${referName}
Points: ${points}
Date: ${date}
Time: ${time}`;

fetch(`https://api.telegram.org/bot${botToken}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
chat_id:adminChatId,
text:message
})
});

}

</script>

</body>
</html>
